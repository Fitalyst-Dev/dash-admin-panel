<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Institute Registry</title>
<style>
  :root {
    --bg: #eef0f5;
    --bg-inset: #e4e7ee;
    --panel: #ffffff;
    --panel-alt: #fbfbfe;
    --border: #dcdfe8;
    --border-soft: #e8eaf1;
    --text: #1b2030;
    --text-soft: #565d70;
    --text-faint: #8a91a3;
    --accent: #3548c4;
    --accent-strong: #2a3aa3;
    --accent-soft: #eaecfb;
    --accent-soft-border: #ccd2f5;
    --success: #17805a;
    --success-soft: #e4f5ee;
    --warning: #a5670a;
    --warning-soft: #fbf0dd;
    --danger: #c0392f;
    --danger-soft: #fbeae8;
    --shadow: 0 1px 2px rgba(23, 27, 43, 0.04), 0 8px 24px -12px rgba(23, 27, 43, 0.18);
    --shadow-lg: 0 24px 48px -20px rgba(23, 27, 43, 0.35);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --font-ui: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10121a;
      --bg-inset: #0b0d13;
      --panel: #181b26;
      --panel-alt: #1d2130;
      --border: #2b2f40;
      --border-soft: #242838;
      --text: #e8e9f2;
      --text-soft: #a3a9bc;
      --text-faint: #6c7288;
      --accent: #7385ff;
      --accent-strong: #93a1ff;
      --accent-soft: #232a4d;
      --accent-soft-border: #34407a;
      --success: #3fc491;
      --success-soft: #16281f;
      --warning: #e0a83e;
      --warning-soft: #2c2410;
      --danger: #f0685f;
      --danger-soft: #2e1917;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 24px 48px -20px rgba(0, 0, 0, 0.7);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft-border); }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  p { margin: 0; }

  .app { display: flex; flex-direction: column; min-height: 100vh; }

  /* ---------- Topbar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    letter-spacing: -0.02em;
    flex-shrink: 0;
  }
  .brand-title { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .brand-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg-inset);
  }
  .topbar-right { display: flex; align-items: center; gap: 10px; }

  .session-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 6px 5px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel-alt);
    font-size: 12.5px;
  }
  .session-pill .role-badge {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent-soft-border);
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 600;
  }
  .session-pill button.icon-btn { width: 22px; height: 22px; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 7px 13px;
    font-size: 13px;
    font-weight: 550;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.05s ease;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg-inset); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-danger { color: var(--danger); border-color: var(--border); }
  .btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--bg-inset); }
  .btn-sm { padding: 4px 9px; font-size: 12px; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 6px;
    border: none; background: transparent; color: var(--text-soft); cursor: pointer;
  }
  .icon-btn:hover { background: var(--bg-inset); color: var(--text); }

  /* ---------- Shell / layout ---------- */
  .shell {
    flex: 1;
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 0;
  }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
  }

  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sidebar-head { padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border-soft); }
  .sidebar-head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .eyebrow {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-faint); font-weight: 650;
  }
  .search-input-wrap { position: relative; }
  .search-input-wrap input {
    width: 100%;
    padding: 7px 10px 7px 28px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--panel-alt);
  }
  .search-input-wrap svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); opacity: 0.5; }

  .institute-list { flex: 1; overflow-y: auto; padding: 8px; }
  .institute-card {
    display: flex; flex-direction: column; gap: 5px;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 3px;
  }
  .institute-card:hover { background: var(--bg-inset); }
  .institute-card.active { background: var(--accent-soft); border-color: var(--accent-soft-border); }
  .institute-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .institute-name { font-weight: 600; font-size: 13.5px; }
  .institute-meta-row { display: flex; align-items: center; gap: 10px; color: var(--text-faint); font-size: 11.5px; font-family: var(--font-mono); }
  .institute-meta-row span { display: flex; align-items: center; gap: 4px; }

  .sidebar-empty, .list-empty {
    padding: 28px 16px; text-align: center; color: var(--text-faint); font-size: 12.5px;
  }

  .pagination-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-top: 1px solid var(--border-soft);
    font-size: 12px; color: var(--text-soft);
  }
  .pagination-bar .pg-controls { display: flex; gap: 6px; }

  /* ---------- Content / detail panel ---------- */
  .content { min-height: 0; overflow-y: auto; padding: 28px 32px 60px; }
  @media (max-width: 860px) { .content { padding: 20px; } }

  .empty-state {
    height: 100%; min-height: 60vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; color: var(--text-faint);
  }
  .empty-state .glyph {
    width: 52px; height: 52px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
  }
  .empty-state h2 { color: var(--text-soft); font-size: 15px; font-weight: 600; }
  .empty-state p { max-width: 320px; font-size: 12.5px; }

  .detail-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .detail-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .detail-title { font-size: 21px; font-weight: 650; letter-spacing: -0.01em; }
  .detail-id { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-faint); }
  .detail-actions { display: flex; gap: 8px; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
    border: 1px solid transparent;
  }
  .pill-dot { width: 6px; height: 6px; border-radius: 999px; }
  .pill-success { background: var(--success-soft); color: var(--success); }
  .pill-success .pill-dot { background: var(--success); }
  .pill-muted { background: var(--bg-inset); color: var(--text-faint); border-color: var(--border); }
  .pill-muted .pill-dot { background: var(--text-faint); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
  .tab-btn {
    padding: 9px 4px; margin-right: 18px;
    background: none; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--text-faint);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 22px; box-shadow: var(--shadow);
  }
  .panel + .panel { margin-top: 16px; }
  .panel-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; gap: 10px; flex-wrap: wrap; }
  .panel-title { font-size: 14px; font-weight: 650; }
  .panel-desc { color: var(--text-soft); font-size: 12.5px; margin-top: 3px; margin-bottom: 18px; max-width: 60ch; }

  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .field-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text-soft); }
  .field input[type="text"], .field input[type="email"], .field input[type="password"], .field select, .field textarea {
    padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--panel-alt); width: 100%;
  }
  .field textarea { resize: vertical; min-height: 70px; font-family: var(--font-mono); font-size: 12.5px; }
  .field-hint { font-size: 11.5px; color: var(--text-faint); }
  .field-hint.warn { color: var(--warning); }

  .meta-table { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; font-size: 12.5px; }
  .meta-table dt { color: var(--text-faint); }
  .meta-table dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .note-box {
    display: flex; gap: 10px; padding: 11px 13px; border-radius: var(--radius-md);
    background: var(--warning-soft); border: 1px solid color-mix(in srgb, var(--warning) 35%, transparent);
    font-size: 12px; color: var(--text-soft); margin-bottom: 18px;
  }
  .note-box svg { flex-shrink: 0; margin-top: 1px; color: var(--warning); }
  .note-box strong { color: var(--text); }

  .whitelist-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .whitelist-grid { grid-template-columns: 1fr; } }

  .add-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .add-row input { flex: 1; }

  .chip-list { display: flex; flex-wrap: wrap; gap: 7px; min-height: 34px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 6px 5px 11px; border-radius: 999px;
    background: var(--panel-alt); border: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 12px;
  }
  .chip button {
    width: 16px; height: 16px; border-radius: 999px; border: none; cursor: pointer;
    background: var(--bg-inset); color: var(--text-faint);
    display: flex; align-items: center; justify-content: center; line-height: 1; font-size: 12px;
    padding: 0;
  }
  .chip button:hover { background: var(--danger-soft); color: var(--danger); }
  .chip-empty { color: var(--text-faint); font-size: 12px; padding: 6px 2px; }

  .roster-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .roster-count { font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .roster-filter { position: relative; flex: 1; max-width: 260px; min-width: 160px; }
  .roster-filter input { width: 100%; padding: 6px 10px 6px 26px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--panel-alt); }
  .roster-filter svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); opacity: 0.5; }

  .bulk-panel { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); display: none; }
  .bulk-panel.open { display: block; }
  .bulk-panel-actions { display: flex; gap: 8px; margin-top: 10px; }

  /* ---------- Dialog / modal ---------- */
  dialog {
    border: none; border-radius: var(--radius-lg); padding: 0; width: min(460px, 92vw);
    background: var(--panel); color: var(--text); box-shadow: var(--shadow-lg);
  }
  dialog::backdrop { background: rgba(10, 12, 20, 0.5); backdrop-filter: blur(1px); }
  .dialog-head { padding: 18px 22px 4px; }
  .dialog-head h3 { font-size: 16px; font-weight: 650; }
  .dialog-body { padding: 16px 22px; display: flex; flex-direction: column; gap: 14px; }
  .dialog-foot { padding: 14px 22px 20px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border-soft); margin-top: 4px; padding-top: 16px; }
  .dialog-error { font-size: 12px; color: var(--danger); min-height: 14px; }

  .segmented { display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .segmented button {
    flex: 1; padding: 7px 8px; border: none; background: var(--panel-alt); cursor: pointer;
    font-size: 12.5px; font-weight: 600; color: var(--text-soft); border-right: 1px solid var(--border);
  }
  .segmented button:last-child { border-right: none; }
  .segmented button.active { background: var(--accent-soft); color: var(--accent); }

  /* ---------- Toasts ---------- */
  .toast-region {
    position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 100;
    max-width: 340px;
  }
  .toast {
    padding: 11px 14px; border-radius: var(--radius-md); background: var(--panel);
    border: 1px solid var(--border); box-shadow: var(--shadow-lg);
    font-size: 12.5px; display: flex; align-items: flex-start; gap: 9px;
    animation: toast-in 0.16s ease-out;
  }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .toast .dot { width: 8px; height: 8px; border-radius: 999px; margin-top: 4px; flex-shrink: 0; }
  .toast.success .dot { background: var(--success); }
  .toast.error .dot { background: var(--danger); }
  .toast.info .dot { background: var(--accent); }

  .spinner {
    width: 15px; height: 15px; border-radius: 999px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner, .toast { animation: none; }
  }

  .center-loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 60px 0; color: var(--text-faint); }

  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">IR</div>
      <div class="brand-title">Institute Registry</div>
      <div class="brand-sub" id="base-url-badge" title="Set via the BASE_URL constant in the script">&mdash;</div>
    </div>
    <div class="topbar-right" id="session-area"></div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-head-row">
          <span class="eyebrow">Institutes</span>
          <button class="btn btn-primary btn-sm" id="new-institute-btn">+ New</button>
        </div>
        <div class="search-input-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="institute-search" placeholder="Filter loaded institutes&hellip;" autocomplete="off" />
        </div>
      </div>
      <div class="institute-list" id="institute-list">
        <div class="center-loading"><div class="spinner"></div> Loading&hellip;</div>
      </div>
      <div class="pagination-bar" id="pagination-bar" style="display:none;">
        <span id="pagination-label">&mdash;</span>
        <div class="pg-controls">
          <button class="btn btn-ghost btn-sm" id="prev-page-btn">&larr; Prev</button>
          <button class="btn btn-ghost btn-sm" id="next-page-btn">Next &rarr;</button>
        </div>
      </div>
    </aside>

    <main class="content" id="content">
      <div class="empty-state">
        <div class="glyph">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 21V7l9-4 9 4v14"/><path d="M3 21h18"/><path d="M9 21v-6h6v6"/></svg>
        </div>
        <h2>Select an institute</h2>
        <p>Choose an institute from the list, or create a new one to manage its details, email whitelist, and student roster.</p>
      </div>
    </main>
  </div>
</div>

<dialog id="create-dialog">
  <form method="dialog" id="create-form">
    <div class="dialog-head"><h3>New institute</h3></div>
    <div class="dialog-body">
      <div class="field">
        <label for="create-name">Institute name</label>
        <input type="text" id="create-name" required placeholder="e.g. Greenview Secondary School" autocomplete="off" />
      </div>
      <div class="field">
        <label for="create-report-time">Default report time</label>
        <select id="create-report-time">
          <option value="24hrs" selected>Every 24 hours</option>
          <option value="12hrs">Every 12 hours</option>
          <option value="6hrs">Every 6 hours</option>
          <option value="2hrs">Every 2 hours</option>
        </select>
      </div>
      <div class="dialog-error" id="create-error"></div>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn" id="create-cancel-btn">Cancel</button>
      <button type="submit" class="btn btn-primary" id="create-submit-btn">Create institute</button>
    </div>
  </form>
</dialog>

<dialog id="signin-dialog">
  <form method="dialog" id="signin-form">
    <div class="dialog-head"><h3>Sign in</h3></div>
    <div class="dialog-body">
      <div class="field">
        <label>Account type</label>
        <div class="segmented" id="entity-type-segmented">
          <button type="button" data-value="super_admin" class="active">Super admin</button>
          <button type="button" data-value="staff_admin">Staff admin</button>
        </div>
      </div>
      <div class="field">
        <label for="signin-email">Email</label>
        <input type="email" id="signin-email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="signin-password">Password</label>
        <input type="password" id="signin-password" required autocomplete="current-password" />
      </div>
      <div class="dialog-error" id="signin-error"></div>
      <details>
        <summary style="cursor:pointer; font-size:12px; color:var(--text-faint);">Have a token already?</summary>
        <div class="field" style="margin-top:10px;">
          <label for="signin-token">Paste bearer token</label>
          <input type="text" id="signin-token" placeholder="eyJhbGciOi&hellip;" autocomplete="off" />
          <span class="field-hint">If filled, this is used instead of email/password.</span>
        </div>
      </details>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn" id="signin-cancel-btn">Cancel</button>
      <button type="submit" class="btn btn-primary" id="signin-submit-btn">Sign in</button>
    </div>
  </form>
</dialog>

<div class="toast-region" id="toast-region"></div>

<script>
/* =========================================================================
   Configuration — edit BASE_URL to point at your Dash server, e.g.
   "http://localhost:5000/api/v1" for local dev or your deployed API origin.
   ========================================================================= */
// const BASE_URL = "http://localhost:5000/api/v1";
const BASE_URL = "https://backend.muruako.com/api/v1";
const PAGE_SIZE = 50;
const SESSION_STORAGE_KEY = "institute_registry_session";

/* ---------------------------------------------------------------------
   State
   --------------------------------------------------------------------- */
const state = {
  token: null,
  admin: null, // { _id, name, email, role, ... }
  institutes: [],
  meta: null,
  page: 1,
  search: "",
  selectedId: null,
  selectedInstitute: null,
  activeTab: "overview",
  loadingList: false,
  loadingDetail: false,
};

/* ---------------------------------------------------------------------
   DOM refs
   --------------------------------------------------------------------- */
const el = {
  baseUrlBadge: document.getElementById("base-url-badge"),
  sessionArea: document.getElementById("session-area"),
  instituteList: document.getElementById("institute-list"),
  instituteSearch: document.getElementById("institute-search"),
  paginationBar: document.getElementById("pagination-bar"),
  paginationLabel: document.getElementById("pagination-label"),
  prevPageBtn: document.getElementById("prev-page-btn"),
  nextPageBtn: document.getElementById("next-page-btn"),
  content: document.getElementById("content"),
  newInstituteBtn: document.getElementById("new-institute-btn"),
  createDialog: document.getElementById("create-dialog"),
  createForm: document.getElementById("create-form"),
  createName: document.getElementById("create-name"),
  createReportTime: document.getElementById("create-report-time"),
  createError: document.getElementById("create-error"),
  createCancelBtn: document.getElementById("create-cancel-btn"),
  signinDialog: document.getElementById("signin-dialog"),
  signinForm: document.getElementById("signin-form"),
  signinEmail: document.getElementById("signin-email"),
  signinPassword: document.getElementById("signin-password"),
  signinToken: document.getElementById("signin-token"),
  signinError: document.getElementById("signin-error"),
  signinCancelBtn: document.getElementById("signin-cancel-btn"),
  entityTypeSegmented: document.getElementById("entity-type-segmented"),
  toastRegion: document.getElementById("toast-region"),
};

el.baseUrlBadge.textContent = BASE_URL;

/* ---------------------------------------------------------------------
   Small utilities
   --------------------------------------------------------------------- */
const escapeHtml = (str) =>
  String(str ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));

const isValidEmail = (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value).trim());

const formatUnix = (seconds) => {
  if (!seconds) return "—";
  try {
    return new Date(seconds * 1000).toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
    });
  } catch { return "—"; }
};

const reportTimeLabel = (value) => ({
  "2hrs": "Every 2 hours", "6hrs": "Every 6 hours", "12hrs": "Every 12 hours", "24hrs": "Every 24 hours",
}[value] || value || "—");

function toast(message, type = "info") {
  const node = document.createElement("div");
  node.className = `toast ${type}`;
  node.innerHTML = `<span class="dot"></span><span>${escapeHtml(message)}</span>`;
  el.toastRegion.appendChild(node);
  setTimeout(() => node.remove(), 4200);
}

/* ---------------------------------------------------------------------
   Session persistence
   --------------------------------------------------------------------- */
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    state.token = parsed.token || null;
    state.admin = parsed.admin || null;
  } catch { /* ignore corrupt session */ }
}
function saveSession() {
  localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({ token: state.token, admin: state.admin }));
}
function clearSession() {
  state.token = null;
  state.admin = null;
  localStorage.removeItem(SESSION_STORAGE_KEY);
}

/* ---------------------------------------------------------------------
   API client
   --------------------------------------------------------------------- */
async function api(path, { method = "GET", body } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (state.token) headers.Authorization = `Bearer ${state.token}`;

  let res;
  try {
    res = await fetch(`${BASE_URL}${path}`, {
      method,
      headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch (networkErr) {
    throw new Error(`Could not reach ${BASE_URL} — is the server running and BASE_URL correct?`);
  }

  let payload = null;
  try { payload = await res.json(); } catch { /* empty body */ }

  if (!res.ok) {
    if (res.status === 401) {
      clearSession();
      renderSessionArea();
      throw new Error("Session expired or invalid. Please sign in again.");
    }
    throw new Error((payload && payload.message) || `Request failed (${res.status})`);
  }
  return payload;
}

/* ---------------------------------------------------------------------
   Sign in / sign out
   --------------------------------------------------------------------- */
function renderSessionArea() {
  if (state.token && state.admin) {
    el.sessionArea.innerHTML = `
      <div class="session-pill">
        <span>${escapeHtml(state.admin.email || "Signed in")}</span>
        <span class="role-badge">${escapeHtml((state.admin.role || "").replace("_", " "))}</span>
        <button class="icon-btn" id="signout-btn" title="Sign out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>`;
    document.getElementById("signout-btn").addEventListener("click", () => {
      clearSession();
      renderSessionArea();
      toast("Signed out.", "info");
    });
  } else {
    el.sessionArea.innerHTML = `<button class="btn btn-primary btn-sm" id="signin-open-btn">Sign in</button>`;
    document.getElementById("signin-open-btn").addEventListener("click", () => openSigninDialog());
  }
}

function openSigninDialog() {
  el.signinError.textContent = "";
  el.signinForm.reset();
  el.signinDialog.showModal();
}
el.signinCancelBtn.addEventListener("click", () => el.signinDialog.close());

el.entityTypeSegmented.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-value]");
  if (!btn) return;
  [...el.entityTypeSegmented.children].forEach((b) => b.classList.toggle("active", b === btn));
});

el.signinForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  el.signinError.textContent = "";
  const submitBtn = document.getElementById("signin-submit-btn");
  submitBtn.disabled = true;
  try {
    const pastedToken = el.signinToken.value.trim();
    if (pastedToken) {
      state.token = pastedToken;
      state.admin = { email: "(token session)", role: "unknown" };
      saveSession();
      renderSessionArea();
      el.signinDialog.close();
      toast("Token applied.", "success");
      loadInstitutes(1);
      return;
    }

    const entityType = el.entityTypeSegmented.querySelector(".active").dataset.value;
    const result = await api("/auth/signin", {
      method: "POST",
      body: {
        entity_type: entityType,
        email: el.signinEmail.value.trim(),
        password: el.signinPassword.value,
      },
    });
    state.token = result.data.token;
    state.admin = result.data.admin;
    saveSession();
    renderSessionArea();
    el.signinDialog.close();
    toast(`Signed in as ${state.admin.email}.`, "success");
    loadInstitutes(1);
  } catch (err) {
    el.signinError.textContent = err.message;
  } finally {
    submitBtn.disabled = false;
  }
});

/* ---------------------------------------------------------------------
   Institute list (sidebar)
   --------------------------------------------------------------------- */
async function loadInstitutes(page = state.page) {
  state.loadingList = true;
  state.page = page;
  renderInstituteList();
  try {
    const result = await api(`/institutes/all?page=${page}&limit=${PAGE_SIZE}`);
    state.institutes = result.data || [];
    state.meta = result.meta || null;
  } catch (err) {
    state.institutes = [];
    state.meta = null;
    toast(err.message, "error");
  } finally {
    state.loadingList = false;
    renderInstituteList();
  }
}

function filteredInstitutes() {
  const q = state.search.trim().toLowerCase();
  if (!q) return state.institutes;
  return state.institutes.filter((inst) => (inst.name || "").toLowerCase().includes(q));
}

function renderInstituteList() {
  if (state.loadingList) {
    el.instituteList.innerHTML = `<div class="center-loading"><div class="spinner"></div> Loading&hellip;</div>`;
    el.paginationBar.style.display = "none";
    return;
  }

  const items = filteredInstitutes();
  if (!state.token) {
    el.instituteList.innerHTML = `<div class="sidebar-empty">Sign in to load institutes.</div>`;
    el.paginationBar.style.display = "none";
    return;
  }
  if (items.length === 0) {
    el.instituteList.innerHTML = `<div class="list-empty">${state.search ? "No institutes match your filter." : "No institutes yet. Create the first one."}</div>`;
  } else {
    el.instituteList.innerHTML = items.map((inst) => `
      <div class="institute-card ${inst._id === state.selectedId ? "active" : ""}" data-id="${inst._id}">
        <div class="institute-card-top">
          <span class="institute-name">${escapeHtml(inst.name)}</span>
        </div>
        <div class="institute-meta-row">
          <span title="Students on roster">${(inst.allStudents || []).length} students</span>
          <span title="Whitelisted senders + recipients">${(inst.allowedSenders || []).length + (inst.allowedRecipients || []).length} whitelisted</span>
        </div>
      </div>
    `).join("");
    el.instituteList.querySelectorAll(".institute-card").forEach((node) => {
      node.addEventListener("click", () => selectInstitute(node.dataset.id));
    });
  }

  if (state.meta && state.meta.totalPages > 1) {
    el.paginationBar.style.display = "flex";
    el.paginationLabel.textContent = `Page ${state.meta.currentPage} of ${state.meta.totalPages} · ${state.meta.totalItems} total`;
    el.prevPageBtn.disabled = !state.meta.hasPreviousPage;
    el.nextPageBtn.disabled = !state.meta.hasNextPage;
  } else {
    el.paginationBar.style.display = "none";
  }
}

el.instituteSearch.addEventListener("input", (e) => {
  state.search = e.target.value;
  renderInstituteList();
});
el.prevPageBtn.addEventListener("click", () => { if (state.meta?.hasPreviousPage) loadInstitutes(state.page - 1); });
el.nextPageBtn.addEventListener("click", () => { if (state.meta?.hasNextPage) loadInstitutes(state.page + 1); });

/* ---------------------------------------------------------------------
   Create institute
   --------------------------------------------------------------------- */
el.newInstituteBtn.addEventListener("click", () => {
  if (!state.token) { toast("Sign in first.", "error"); openSigninDialog(); return; }
  el.createError.textContent = "";
  el.createForm.reset();
  el.createDialog.showModal();
  el.createName.focus();
});
el.createCancelBtn.addEventListener("click", () => el.createDialog.close());

el.createForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  el.createError.textContent = "";
  const submitBtn = document.getElementById("create-submit-btn");
  const name = el.createName.value.trim();
  if (!name) { el.createError.textContent = "Institute name is required."; return; }

  submitBtn.disabled = true;
  try {
    const result = await api("/institutes/add", {
      method: "POST",
      body: { name, defaultReportTime: el.createReportTime.value },
    });
    el.createDialog.close();
    toast(`"${name}" created.`, "success");
    await loadInstitutes(1);
    const created = result.data && result.data.institute;
    if (created) selectInstitute(created._id);
  } catch (err) {
    el.createError.textContent = err.message;
  } finally {
    submitBtn.disabled = false;
  }
});

/* ---------------------------------------------------------------------
   Institute detail
   --------------------------------------------------------------------- */
async function selectInstitute(id) {
  state.selectedId = id;
  state.activeTab = "overview";
  state.loadingDetail = true;
  renderInstituteList();
  renderContent();
  try {
    const result = await api(`/institutes/find/${id}`);
    state.selectedInstitute = result.data;
  } catch (err) {
    toast(err.message, "error");
    state.selectedInstitute = null;
  } finally {
    state.loadingDetail = false;
    renderContent();
  }
}

async function refreshSelectedInstitute() {
  if (!state.selectedId) return;
  try {
    const result = await api(`/institutes/find/${state.selectedId}`);
    state.selectedInstitute = result.data;
    // keep sidebar counts in sync without a full reload
    const idx = state.institutes.findIndex((i) => i._id === state.selectedId);
    if (idx !== -1) state.institutes[idx] = result.data;
    renderInstituteList();
    renderContent();
  } catch (err) {
    toast(err.message, "error");
  }
}

async function patchInstitute(id, body, successMessage) {
  await api(`/institutes/update/${id}`, { method: "PATCH", body });
  if (successMessage) toast(successMessage, "success");
  await refreshSelectedInstitute();
}

function renderContent() {
  if (!state.selectedId) {
    el.content.innerHTML = `
      <div class="empty-state">
        <div class="glyph">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 21V7l9-4 9 4v14"/><path d="M3 21h18"/><path d="M9 21v-6h6v6"/></svg>
        </div>
        <h2>Select an institute</h2>
        <p>Choose an institute from the list, or create a new one to manage its details, email whitelist, and student roster.</p>
      </div>`;
    return;
  }

  if (state.loadingDetail || !state.selectedInstitute) {
    el.content.innerHTML = `<div class="center-loading"><div class="spinner"></div> Loading institute&hellip;</div>`;
    return;
  }

  const inst = state.selectedInstitute;
  el.content.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-title-row">
          <h1 class="detail-title">${escapeHtml(inst.name)}</h1>
          <span class="pill pill-muted"><span class="pill-dot"></span>${reportTimeLabel(inst.defaultReportTime)}</span>
        </div>
        <div class="detail-id">${escapeHtml(inst._id)}</div>
      </div>
      <div class="detail-actions">
        <button class="btn btn-danger" id="delete-institute-btn">Delete institute</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn ${state.activeTab === "overview" ? "active" : ""}" data-tab="overview">Overview</button>
      <button class="tab-btn ${state.activeTab === "whitelist" ? "active" : ""}" data-tab="whitelist">Email whitelist</button>
      <button class="tab-btn ${state.activeTab === "students" ? "active" : ""}" data-tab="students">Students</button>
    </div>

    <div id="tab-panel"></div>
  `;

  document.getElementById("delete-institute-btn").addEventListener("click", () => handleDeleteInstitute(inst));
  el.content.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => { state.activeTab = btn.dataset.tab; renderContent(); });
  });

  const tabPanel = document.getElementById("tab-panel");
  if (state.activeTab === "overview") tabPanel.innerHTML = overviewTabHtml(inst);
  else if (state.activeTab === "whitelist") tabPanel.innerHTML = whitelistTabHtml(inst);
  else tabPanel.innerHTML = studentsTabHtml(inst);

  if (state.activeTab === "overview") wireOverviewTab(inst);
  else if (state.activeTab === "whitelist") wireWhitelistTab(inst);
  else wireStudentsTab(inst);
}

async function handleDeleteInstitute(inst) {
  if (!confirm(`Delete "${inst.name}"? This cannot be undone.`)) return;
  try {
    await api(`/institutes/delete/${inst._id}`, { method: "DELETE" });
    toast(`"${inst.name}" deleted.`, "success");
    state.selectedId = null;
    state.selectedInstitute = null;
    renderContent();
    await loadInstitutes(state.page);
  } catch (err) {
    toast(err.message, "error");
  }
}

/* ---- Overview tab ---- */
function overviewTabHtml(inst) {
  return `
    <div class="panel">
      <div class="panel-title-row"><span class="panel-title">Institute details</span></div>
      <p class="panel-desc">Basic information used across reports and email routing.</p>
      <form id="overview-form">
        <div class="field-grid">
          <div class="field">
            <label for="overview-name">Institute name</label>
            <input type="text" id="overview-name" value="${escapeHtml(inst.name)}" required />
          </div>
          <div class="field">
            <label for="overview-report-time">Default report time</label>
            <select id="overview-report-time">
              <option value="24hrs" ${inst.defaultReportTime === "24hrs" ? "selected" : ""}>Every 24 hours</option>
              <option value="12hrs" ${inst.defaultReportTime === "12hrs" ? "selected" : ""}>Every 12 hours</option>
              <option value="6hrs" ${inst.defaultReportTime === "6hrs" ? "selected" : ""}>Every 6 hours</option>
              <option value="2hrs" ${inst.defaultReportTime === "2hrs" ? "selected" : ""}>Every 2 hours</option>
            </select>
            <span class="field-hint warn">Currently not persisted by the API (known backend field-mapping issue on /institutes/update).</span>
          </div>
        </div>
        <div style="margin-top:16px; display:flex; gap:8px;">
          <button type="submit" class="btn btn-primary" id="overview-save-btn">Save changes</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <div class="panel-title-row"><span class="panel-title">Metadata</span></div>
      <dl class="meta-table" style="margin-top:14px;">
        <dt>ID</dt><dd>${escapeHtml(inst._id)}</dd>
        <dt>Created</dt><dd>${formatUnix(inst.createdAt)}</dd>
        <dt>Updated</dt><dd>${formatUnix(inst.updatedAt)}</dd>
        <dt>Students on roster</dt><dd>${(inst.allStudents || []).length}</dd>
        <dt>Whitelisted senders</dt><dd>${(inst.allowedSenders || []).length}</dd>
        <dt>Whitelisted recipients</dt><dd>${(inst.allowedRecipients || []).length}</dd>
      </dl>
    </div>
  `;
}

function wireOverviewTab(inst) {
  document.getElementById("overview-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("overview-save-btn");
    const name = document.getElementById("overview-name").value.trim();
    const defaultReportTime = document.getElementById("overview-report-time").value;
    if (!name) { toast("Institute name is required.", "error"); return; }
    btn.disabled = true;
    try {
      await patchInstitute(inst._id, { name, defaultReportTime }, "Institute updated.");
    } catch (err) {
      toast(err.message, "error");
    } finally {
      btn.disabled = false;
    }
  });
}

/* ---- Whitelist tab (allowedSenders / allowedRecipients) ---- */
function whitelistTabHtml(inst) {
  const senders = inst.allowedSenders || [];
  const recipients = inst.allowedRecipients || [];
  return `
    <div class="note-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>
      <div><strong>Staff email whitelist.</strong> These are the staff addresses allowed to send report emails in, and the addresses allowed to receive routed messages out, for this institute.</div>
    </div>
    <div class="whitelist-grid">
      <div class="panel">
        <span class="panel-title">Allowed senders</span>
        <p class="panel-desc">Staff emails permitted to send email-to-message reports for this institute.</p>
        <div class="add-row">
          <input type="email" id="sender-input" placeholder="staff@school.edu" autocomplete="off" />
          <button class="btn btn-primary" id="sender-add-btn">Add</button>
        </div>
        <div class="chip-list" id="sender-chip-list">
          ${senders.length ? senders.map((e) => chipHtml(e, "sender")).join("") : `<span class="chip-empty">No senders whitelisted yet.</span>`}
        </div>
      </div>
      <div class="panel">
        <span class="panel-title">Allowed recipients</span>
        <p class="panel-desc">Staff emails permitted to receive routed messages for this institute.</p>
        <div class="add-row">
          <input type="email" id="recipient-input" placeholder="staff@school.edu" autocomplete="off" />
          <button class="btn btn-primary" id="recipient-add-btn">Add</button>
        </div>
        <div class="chip-list" id="recipient-chip-list">
          ${recipients.length ? recipients.map((e) => chipHtml(e, "recipient")).join("") : `<span class="chip-empty">No recipients whitelisted yet.</span>`}
        </div>
      </div>
    </div>
  `;
}

function chipHtml(email, kind) {
  return `<span class="chip" data-email="${escapeHtml(email)}"><span>${escapeHtml(email)}</span><button data-kind="${kind}" data-email="${escapeHtml(email)}" title="Remove">&times;</button></span>`;
}

function wireWhitelistTab(inst) {
  const senderInput = document.getElementById("sender-input");
  const recipientInput = document.getElementById("recipient-input");

  document.getElementById("sender-add-btn").addEventListener("click", () => addToListField(inst, "allowedSenders", senderInput));
  senderInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addToListField(inst, "allowedSenders", senderInput); } });

  document.getElementById("recipient-add-btn").addEventListener("click", () => addToListField(inst, "allowedRecipients", recipientInput));
  recipientInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addToListField(inst, "allowedRecipients", recipientInput); } });

  el.content.querySelectorAll('[data-kind="sender"]').forEach((btn) =>
    btn.addEventListener("click", () => removeFromListField(inst, "allowedSenders", btn.dataset.email)));
  el.content.querySelectorAll('[data-kind="recipient"]').forEach((btn) =>
    btn.addEventListener("click", () => removeFromListField(inst, "allowedRecipients", btn.dataset.email)));
}

async function addToListField(inst, field, inputEl) {
  const value = inputEl.value.trim().toLowerCase();
  if (!value) return;
  if (!isValidEmail(value)) { toast("Enter a valid email address.", "error"); return; }
  const current = inst[field] || [];
  if (current.some((e) => e.toLowerCase() === value)) { toast("Already whitelisted.", "info"); inputEl.value = ""; return; }
  try {
    await patchInstitute(inst._id, { [field]: [...current, value] }, "Added.");
    inputEl.value = "";
  } catch (err) {
    toast(err.message, "error");
  }
}

async function removeFromListField(inst, field, email) {
  const current = inst[field] || [];
  try {
    await patchInstitute(inst._id, { [field]: current.filter((e) => e !== email) }, "Removed.");
  } catch (err) {
    toast(err.message, "error");
  }
}

/* ---- Students tab (allStudents roster) ---- */
let studentRosterFilter = "";

function studentsTabHtml(inst) {
  const roster = inst.allStudents || [];
  const filtered = studentRosterFilter
    ? roster.filter((e) => e.toLowerCase().includes(studentRosterFilter.toLowerCase()))
    : roster;
  return `
    <div class="panel">
      <div class="panel-title-row">
        <span class="panel-title">Student roster</span>
      </div>
      <p class="panel-desc">Students enrolled at this institute, identified by email.</p>

      <div class="add-row">
        <input type="email" id="student-input" placeholder="student@school.edu" autocomplete="off" />
        <button class="btn btn-primary" id="student-add-btn">Add</button>
        <button class="btn" id="bulk-toggle-btn" type="button">Bulk add</button>
      </div>

      <div class="bulk-panel" id="bulk-panel">
        <div class="field">
          <label for="bulk-textarea">Paste multiple emails (comma, space, or newline separated)</label>
          <textarea id="bulk-textarea" placeholder="alice@school.edu, bob@school.edu&#10;carol@school.edu"></textarea>
        </div>
        <div class="bulk-panel-actions">
          <button class="btn btn-primary btn-sm" id="bulk-add-btn">Add all</button>
          <button class="btn btn-sm" id="bulk-cancel-btn" type="button">Cancel</button>
        </div>
      </div>

      <div class="roster-toolbar" style="margin-top:18px;">
        <div class="roster-filter">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="student-filter-input" placeholder="Filter roster&hellip;" value="${escapeHtml(studentRosterFilter)}" />
        </div>
        <span class="roster-count">${filtered.length} of ${roster.length} students</span>
      </div>

      <div class="chip-list" id="student-chip-list">
        ${filtered.length ? filtered.map((e) => chipHtml(e, "student")).join("") : `<span class="chip-empty">${roster.length ? "No students match your filter." : "No students on the roster yet."}</span>`}
      </div>
    </div>
  `;
}

function wireStudentsTab(inst) {
  const studentInput = document.getElementById("student-input");
  document.getElementById("student-add-btn").addEventListener("click", () => addToListField(inst, "allStudents", studentInput));
  studentInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addToListField(inst, "allStudents", studentInput); } });

  const bulkPanel = document.getElementById("bulk-panel");
  document.getElementById("bulk-toggle-btn").addEventListener("click", () => bulkPanel.classList.toggle("open"));
  document.getElementById("bulk-cancel-btn").addEventListener("click", () => { bulkPanel.classList.remove("open"); document.getElementById("bulk-textarea").value = ""; });

  document.getElementById("bulk-add-btn").addEventListener("click", async () => {
    const raw = document.getElementById("bulk-textarea").value;
    const candidates = raw.split(/[\s,]+/).map((s) => s.trim().toLowerCase()).filter(Boolean);
    const valid = [...new Set(candidates.filter(isValidEmail))];
    const invalidCount = candidates.length - valid.length;
    if (!valid.length) { toast("No valid email addresses found.", "error"); return; }
    const current = inst.allStudents || [];
    const merged = [...new Set([...current, ...valid])];
    const addedCount = merged.length - current.length;
    try {
      await patchInstitute(inst._id, { allStudents: merged }, `Added ${addedCount} student${addedCount === 1 ? "" : "s"}.${invalidCount ? ` Skipped ${invalidCount} invalid entr${invalidCount === 1 ? "y" : "ies"}.` : ""}`);
      bulkPanel.classList.remove("open");
      document.getElementById("bulk-textarea").value = "";
    } catch (err) {
      toast(err.message, "error");
    }
  });

  document.getElementById("student-filter-input").addEventListener("input", (e) => {
    studentRosterFilter = e.target.value;
    updateStudentChipList(inst);
  });

  wireStudentChipRemoveButtons(inst);
}

function updateStudentChipList(inst) {
  const roster = inst.allStudents || [];
  const filtered = studentRosterFilter
    ? roster.filter((e) => e.toLowerCase().includes(studentRosterFilter.toLowerCase()))
    : roster;

  document.querySelector(".roster-count").textContent = `${filtered.length} of ${roster.length} students`;
  document.getElementById("student-chip-list").innerHTML = filtered.length
    ? filtered.map((e) => chipHtml(e, "student")).join("")
    : `<span class="chip-empty">${roster.length ? "No students match your filter." : "No students on the roster yet."}</span>`;

  wireStudentChipRemoveButtons(inst);
}

function wireStudentChipRemoveButtons(inst) {
  el.content.querySelectorAll('[data-kind="student"]').forEach((btn) =>
    btn.addEventListener("click", () => removeFromListField(inst, "allStudents", btn.dataset.email)));
}

/* ---------------------------------------------------------------------
   Boot
   --------------------------------------------------------------------- */
loadSession();
renderSessionArea();
if (state.token) {
  loadInstitutes(1);
} else {
  renderInstituteList();
}
</script>
